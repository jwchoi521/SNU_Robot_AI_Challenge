esp32_serial_bridge:
  ros__parameters:
    dry_run: true
    serial_port: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
    baud_rate: 115200
    reset_on_open: false
    reset_pulse_sec: 0.1
    serial_reset_wait_sec: 2.0
    esp32_protocol: u_shape
    esp32_command_mode: encoder_velocity
    command_topic: /wheel_commands
    gripper_command_topic: /gripper/command
    capture_arm_topic: /capture/arm
    joint_states_topic: /joint_states
    command_timeout_sec: 0.5
    read_rate_hz: 100.0
    max_power: 0.35
    u_shape_pwm_max: 120
    log_serial_writes: false
    log_pwm_status: false
    close_gate_on_start: true
    disarm_capture_on_start: true
    publish_imu: true
    imu_topic: /imu
    imu_frame: base_link
    imu_yaw_offset_deg: 0.0
    # Retry IMU ON until the first IMU sample is received. 0 max attempts means
    # keep retrying, useful when ESP32 ignores the first command during reset.
    imu_enable_retry_sec: 1.0
    imu_enable_retry_max_attempts: 0
    # Full robot launch can enable this so Nav2 cannot drive before IMU is ready.
    require_imu_before_motion: false
    required_imu_max_age_sec: 1.0
    stop_repeat_sec: 0.25
    max_wheel_velocity_rad_s: 50.0

    # Effective wheel encoder scale after removing firmware-side 1.3x tick scaling.
    encoder_counts_per_revolution: 684.8

    front_left_joint: front_left_wheel_joint
    front_right_joint: front_right_wheel_joint
    rear_left_joint: rear_left_wheel_joint
    rear_right_joint: rear_right_wheel_joint

    # Keep ROS commands in robot-frame wheel direction.
    # Electrical motor direction is handled in the ESP32 firmware.
    front_left_motor_sign: 1.0
    front_right_motor_sign: 1.0
    rear_left_motor_sign: 1.0
    rear_right_motor_sign: 1.0

    # Keep these at 1.0 when ESP32 firmware already reports forward-positive counts.
    # Flip here only for ROS-only display compensation; ESP32 PID uses firmware signs.
    front_left_encoder_sign: 1.0
    front_right_encoder_sign: 1.0
    rear_left_encoder_sign: 1.0
    rear_right_encoder_sign: 1.0

wheel_jog_test:
  ros__parameters:
    wheel_command_topic: /wheel_commands
    power: 0.10
    run_sec: 0.40
    pause_sec: 0.80
    include_reverse: false
    repeat: false
    wheel_order:
      - front_left
      - front_right
      - rear_left
      - rear_right
