esp32_serial_bridge:
  ros__parameters:
    dry_run: true
    serial_port: /dev/ttyUSB0
    baud_rate: 115200
    serial_reset_wait_sec: 2.0
    esp32_protocol: motor_bridge
    esp32_command_mode: velocity
    command_topic: /wheel_commands
    gripper_command_topic: /gripper/command
    joint_states_topic: /joint_states
    command_timeout_sec: 0.5
    read_rate_hz: 100.0
    max_power: 0.12
    u_shape_pwm_max: 120
    log_serial_writes: false
    close_gate_on_start: true
    max_wheel_velocity_rad_s: 20.0

    # Measured wheel encoder scale: 141.7 counts/rad * 2*pi.
    encoder_counts_per_revolution: 890.3

    front_left_joint: front_left_wheel_joint
    front_right_joint: front_right_wheel_joint
    rear_left_joint: rear_left_wheel_joint
    rear_right_joint: rear_right_wheel_joint

    # Keep ROS commands in robot-frame wheel direction.
    # Electrical motor direction is handled in the ESP32 firmware.
    front_left_motor_sign: 1.0
    front_right_motor_sign: 1.0
    rear_left_motor_sign: 1.0
    rear_right_motor_sign: 1.0

    # Keep these at 1.0 when ESP32 firmware already reports forward-positive counts.
    # Flip here only for ROS-only display compensation; ESP32 PID uses firmware signs.
    front_left_encoder_sign: 1.0
    front_right_encoder_sign: 1.0
    rear_left_encoder_sign: 1.0
    rear_right_encoder_sign: 1.0

wheel_jog_test:
  ros__parameters:
    wheel_command_topic: /wheel_commands
    power: 0.10
    run_sec: 0.40
    pause_sec: 0.80
    include_reverse: false
    repeat: false
    wheel_order:
      - front_left
      - front_right
      - rear_left
      - rear_right
