gpio_four_wheel_driver:
  ros__parameters:
    # Keep true until pin numbering and wheel direction are confirmed on Jetson.
    dry_run: true

    # The provided numbers look like GPIO/BCM-style numbers, not physical BOARD pins.
    # If they are physical Jetson 40-pin header numbers, do not set dry_run false yet.
    pin_numbering: BCM
    allow_reserved_board_pins: false

    command_topic: /wheel_commands
    command_timeout_sec: 0.5
    pwm_frequency_hz: 1000.0
    max_duty_cycle: 0.12
    max_wheel_velocity_rad_s: 20.0

    # Motor driver input pins from the current wiring note.
    rear_right_pin_a: 14
    rear_right_pin_b: 13
    front_right_pin_a: 4
    front_right_pin_b: 5
    rear_left_pin_a: 2
    rear_left_pin_b: 15
    front_left_pin_a: 23
    front_left_pin_b: 25

    # Flip a sign if a wheel rotates opposite to the expected direction.
    front_left_sign: 1.0
    front_right_sign: 1.0
    rear_left_sign: 1.0
    rear_right_sign: 1.0

gpio_encoder_joint_state:
  ros__parameters:
    dry_run: true
    pin_numbering: BCM
    allow_reserved_board_pins: false
    joint_states_topic: /joint_states
    publish_rate_hz: 20.0
    poll_rate_hz: 500.0

    # Must be calibrated from the actual encoder spec and gear ratio.
    # Measured wheel encoder scale: 141.7 counts/rad * 2*pi.
    encoder_counts_per_revolution: 890.3

    front_left_joint: front_left_wheel_joint
    front_right_joint: front_right_wheel_joint
    rear_left_joint: rear_left_wheel_joint
    rear_right_joint: rear_right_wheel_joint

    rear_right_encoder_a_pin: 26
    rear_right_encoder_b_pin: 27
    front_right_encoder_a_pin: 16
    front_right_encoder_b_pin: 17
    rear_left_encoder_a_pin: 32
    rear_left_encoder_b_pin: 33
    front_left_encoder_a_pin: 18
    front_left_encoder_b_pin: 19

    # Flip a sign if encoder position decreases while the wheel moves forward.
    front_left_sign: 1.0
    front_right_sign: 1.0
    rear_left_sign: 1.0
    rear_right_sign: 1.0

wheel_jog_test:
  ros__parameters:
    wheel_command_topic: /wheel_commands
    power: 0.10
    run_sec: 0.40
    pause_sec: 0.80
    include_reverse: false
    repeat: false
    wheel_order:
      - front_left
      - front_right
      - rear_left
      - rear_right
