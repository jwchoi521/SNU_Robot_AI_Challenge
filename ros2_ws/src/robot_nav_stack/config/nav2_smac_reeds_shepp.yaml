planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      motion_model_for_search: "REEDS_SHEPP"
      minimum_turning_radius: 0.35
      reverse_penalty: 3.0
      change_penalty: 0.5
      non_straight_penalty: 1.15
      angle_quantization_bins: 72
      smooth_path: true
      allow_unknown: true

controller_server:
  ros__parameters:
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    controller_plugins: ["FollowPath"]
    goal_checker_plugins: ["goal_checker"]
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.17
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.45
      lookahead_dist: 0.55
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.9
      rotate_to_heading_angular_vel: 1.2
      use_rotate_to_heading: true
      allow_reversing: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # Measured outer chassis footprint: length 0.32m, width 0.33m.
      footprint: "[[0.16, 0.165], [0.16, -0.165], [-0.16, -0.165], [-0.16, 0.165]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan semantic_cloud
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
        semantic_cloud:
          topic: /semantic_obstacles
          max_obstacle_height: 1.0
          min_obstacle_height: -0.1
          obstacle_max_range: 6.0
          raytrace_max_range: 6.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      # Measured outer chassis footprint: length 0.32m, width 0.33m.
      footprint: "[[0.16, 0.165], [0.16, -0.165], [-0.16, -0.165], [-0.16, 0.165]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan semantic_cloud
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
        semantic_cloud:
          topic: /semantic_obstacles
          max_obstacle_height: 1.0
          min_obstacle_height: -0.1
          obstacle_max_range: 8.0
          raytrace_max_range: 8.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30
        cost_scaling_factor: 3.0
