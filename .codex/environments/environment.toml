# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "robot_object_detector"

[setup]
script = ""

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"

if ($env:CODEX_WORKTREE_PATH) {
    Set-Location $env:CODEX_WORKTREE_PATH
}

Write-Host "[setup] Worktree: $(Get-Location)"

if (!(Test-Path "requirements.txt")) {
@"
ultralytics
opencv-python
numpy
pyyaml
tqdm
"@ | Set-Content -Encoding UTF8 "requirements.txt"
}

if (!(Test-Path "requirements-dev.txt")) {
@"
pytest
ruff
mypy
"@ | Set-Content -Encoding UTF8 "requirements-dev.txt"
}

if (!(Test-Path ".venv")) {
    Write-Host "[setup] Creating virtual environment"
    if (Get-Command py -ErrorAction SilentlyContinue) {
        py -3 -m venv .venv
    } else {
        python -m venv .venv
    }
} else {
    Write-Host "[setup] Reusing .venv"
}

$Python = ".\.venv\Scripts\python.exe"

& $Python -m pip install --upgrade pip setuptools wheel
& $Python -m pip install -r requirements.txt
& $Python -m pip install -r requirements-dev.txt

$dirs = @(
    "dataset/images/train",
    "dataset/images/val",
    "dataset/images/test",
    "dataset/labels/train",
    "dataset/labels/val",
    "dataset/labels/test",
    "src",
    "scripts",
    "tests",
    "runs",
    "logs",
    "outputs"
)

foreach ($dir in $dirs) {
    New-Item -ItemType Directory -Force -Path $dir | Out-Null
}

if (!(Test-Path "dataset/data.yaml")) {
@"
path: ./dataset

train: images/train
val: images/val
test: images/test

names:
  0: cube_any
  1: octahedron
  2: dodecahedron
  3: icosahedron
  4: apple_sticker
  5: orange_sticker
  6: banana_sticker
  7: pineapple_sticker
"@ | Set-Content -Encoding UTF8 "dataset/data.yaml"
}

if (Test-Path "scripts/check_env.py") {
    & $Python scripts/check_env.py
} else {
    Write-Host "[setup] scripts/check_env.py not found yet. Skipping environment check."
}

Write-Host "[setup] Done"
'''

[cleanup]
script = ""

[cleanup.win32]
script = '''
$ErrorActionPreference = "Continue"

if ($env:CODEX_WORKTREE_PATH) {
    Set-Location $env:CODEX_WORKTREE_PATH
}

Write-Host "[clean] Worktree: $(Get-Location)"

Write-Host "[clean] Removing Python cache files"

Get-ChildItem -Path . -Recurse -Force -Directory -Filter "__pycache__" |
    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

Get-ChildItem -Path . -Recurse -Force -Directory -Filter ".pytest_cache" |
    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

Get-ChildItem -Path . -Recurse -Force -Directory -Filter ".ruff_cache" |
    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

Get-ChildItem -Path . -Recurse -Force -Directory -Filter ".mypy_cache" |
    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

Get-ChildItem -Path . -Recurse -Force -File -Filter "*.pyc" |
    Remove-Item -Force -ErrorAction SilentlyContinue

Write-Host "[clean] Removing temporary outputs"

Remove-Item -Recurse -Force "outputs/tmp" -ErrorAction SilentlyContinue
Remove-Item -Recurse -Force "runs/smoke" -ErrorAction SilentlyContinue
Remove-Item -Recurse -Force "runs/debug" -ErrorAction SilentlyContinue
Remove-Item -Recurse -Force "runs/tmp" -ErrorAction SilentlyContinue

Write-Host "[clean] Done"
'''

[[actions]]
name = "Check Env"
icon = "tool"
command = ".\\.venv\\Scripts\\python.exe scripts\\check_env.py"

[[actions]]
name = "Lint"
icon = "tool"
command = ".\\.venv\\Scripts\\python.exe -m ruff check src tests scripts"

[[actions]]
name = "Format"
icon = "tool"
command = ".\\.venv\\Scripts\\python.exe -m ruff format src tests scripts"

[[actions]]
name = "Test"
icon = "tool"
command = ".\\.venv\\Scripts\\python.exe -m pytest -q"

[[actions]]
name = "Dataset Check"
icon = "tool"
command = ".\\.venv\\Scripts\\python.exe scripts\\check_dataset.py --data dataset/data.yaml"

[[actions]]
name = "Smoke Train TPU"
icon = "tool"
command = ".\\.venv\\Scripts\\python.exe src/train.py --data dataset/data.yaml --model yolo11n.pt --epochs 1 --imgsz 320 --batch 2 --device cpu --project runs/smoke --name cpu_smoke"

[[actions]]
name = "Clean"
icon = "tool"
command = "Get-ChildItem -Path . -Recurse -Force -Directory -Filter \"__pycache__\" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue; Get-ChildItem -Path . -Recurse -Force -File -Filter \"*.pyc\" | Remove-Item -Force -ErrorAction SilentlyContinue; Remove-Item -Recurse -Force \"outputs/tmp\",\"runs/smoke\",\"runs/debug\",\"runs/tmp\" -ErrorAction SilentlyContinue"
